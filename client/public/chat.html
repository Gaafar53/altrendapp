<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دردشة بدون ريفرش</title><style>body{background:#0a0a0f;color:#fff;padding:12px;padding-bottom:80px;font-family:system-ui;display:flex;flex-direction:column;height:100vh}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}.msg{background:#15151f;padding:8px;border-radius:10px;max-width:80%}.msg.me{background:#2563EB;align-self:flex-end}.bar{position:fixed;bottom:20px;left:10px;right:10px;display:flex;gap:6px}.bar input{flex:1;background:#1e1e2e;color:#fff;padding:10px;border-radius:20px;border:1px solid #2a2a3a}.bar button{background:#10B981;padding:10px 16px;border-radius:20px;border:none}</style></head><body><h3 style="text-align:center">💬 دردشة - بدون ريفرش</h3><div id="msgs" class="msgs"></div><div class="bar"><input id="t" placeholder="رسالة..."><button onclick="send()">إرسال</button></div><script>let seen=new Set();async function load(){let r=await fetch('/api/chat/feed');let f=await r.json();let d=document.getElementById('msgs');f.reverse().forEach(m=>{let id=String(m.id);if(seen.has(id))return;seen.add(id);let div=document.createElement('div');div.className='msg '+(m.author.includes('انا')?'me':'');div.innerHTML=`<b style="font-size:10px">${m.author}</b><div>${m.text}</div>`;d.appendChild(div)});d.scrollTop=d.scrollHeight}async function send(){let v=document.getElementById('t').value;if(!v.trim())return;await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v,author:'انا'})});document.getElementById('t').value='';load()}load();setInterval(load,3000);</script></body></html>

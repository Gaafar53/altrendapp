<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>عام - بدون ريفرش</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0f;color:#fff;padding:12px;padding-bottom:90px;font-family:system-ui}
.card{background:#15151f;border:1px solid #232336;border-radius:16px;padding:12px;margin:10px 0;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card.new{border-color:#10B981;box-shadow:0 0 0 1px #10B98133}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f5c75d,#ff7a00);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.likeBtn{cursor:pointer;padding:6px 10px;border-radius:20px;background:#1e1e2e;display:inline-flex;gap:4px;font-size:12px;border:1px solid #2a2a3a}
.likeBtn.liked{background:#1f0f15;border-color:#ec4899;color:#ec4899}
video{width:100%;border-radius:12px;max-height:50vh;margin-top:8px}
.top{position:sticky;top:0;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);padding:10px;z-index:10;border-bottom:1px solid #1e1e2e;display:flex;justify-content:space-between;align-items:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);border-top:1px solid #1e1e2e;display:flex;justify-content:space-around;padding:8px 0}.nav a{color:#5a5a72;text-decoration:none;font-size:10px;flex:1;text-align:center}.nav a.active{color:#fff}
</style></head><body>
<div class="top"><div><b>🌐 عام للكل</b><div style="font-size:10px;color:#888" id="status">بدون ريفرش مزعج - تحديث ذكي</div></div><div><button onclick="load(true)" style="background:#1e1e2e;color:#fff;padding:6px 12px;border-radius:20px;border:1px solid #2a2a3a;font-size:11px">🔄 تحديث</button> <label style="font-size:10px"><input type="checkbox" id="auto" checked onchange="toggleAuto()"> تلقائي</label></div></div>
<div id="feed"></div>
<div class="nav"><a href="/">🏠 ترند</a><a href="/country">🌍 دول + 🔵</a><a href="/my">🔒 خاص</a><a href="/public" class="active">🌐 عام</a><a href="/chat">💬 دردشة</a></div>

<script>
let seenIds=new Set(); let auto=true; let myName='انا';
async function getMyName(){try{let r=await fetch('/api/profile');let p=await r.json();myName=p.myName}catch(e){}}

async function load(force=false){
  let r=await fetch('/api/public/feed'); let f=await r.json();
  let d=document.getElementById('feed');
  let newCount=0;
  // اعرض من الأحدث للأقدم بدون مسح القديم - ذكي
  f.slice().reverse().forEach(i=>{
    let id=String(i.id||i.index);
    if(seenIds.has(id) && !force) return;
    seenIds.add(id);
    let liked=(i.likedBy||[]).includes(myName);
    let div=document.createElement('div'); div.className='card'+(!seenIds.has(id) || force?'':' new'); div.dataset.id=id;
    div.innerHTML=`
      <div style="display:flex;gap:8px;align-items:center">
        <div class="avatar">${(i.author||'?')[0]}</div>
        <div style="flex:1"><b>${i.author} <span style="font-size:10px;color:#60A5FA">🔵 ${i.btName||''}</span></b><div style="font-size:10px;color:#888">[${i.country}] • ${i.time} • ${i.isPrivate?'🔒':'🌐'}</div></div>
      </div>
      <div style="margin:8px 0;line-height:1.5">${i.text}</div>
      ${i.video?`<video src="${i.video}" controls playsinline preload="metadata"></video>`:''}
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <span class="likeBtn ${liked?'liked':''}" onclick="likePost(${i.id||i.index},this)"><span>${liked?'❤️':'🤍'}</span> <b>${i.likes||0}</b></span>
        <span style="font-size:11px;color:#666">${(i.likedBy||[]).slice(0,3).join(', ')}</span>
        <span style="margin-left:auto;font-size:10px;color:#555">#${i.index}</span>
      </div>`;
    // أضف في الأول بدون ما تمسح الباقي
    d.prepend(div);
    newCount++;
  });
  if(newCount>0 && !force){
    document.getElementById('status').textContent=`+${newCount} جديد • بدون ريفرش • ${new Date().toLocaleTimeString()}`;
    setTimeout(()=>{document.getElementById('status').textContent='بدون ريفرش مزعج - تحديث ذكي'},3000);
  }
  // لو force امسح القديم ورتب
  if(force){
    seenIds.clear();
    f.forEach(i=>seenIds.add(String(i.id||i.index)));
  }
}

async function likePost(postId,el){
  let r=await fetch('/api/country/like/'+postId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:myName})});
  let p=await r.json();
  if(p){el.classList.toggle('liked',p.likedBy.includes(myName)); el.querySelector('span').textContent=p.likedBy.includes(myName)?'❤️':'🤍'; el.querySelector('b').textContent=p.likes;}
}

function toggleAuto(){auto=document.getElementById('auto').checked;}

getMyName();
// تحديث ذكي كل 8 ثواني بدون مسح - فقط الجديد
setInterval(()=>{if(auto)load(false)},8000);
load(false);
</script></body></html>

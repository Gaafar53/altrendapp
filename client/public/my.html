<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خاص بدون ريفرش</title><style>body{background:#0a0a0f;color:#fff;padding:12px;font-family:system-ui}.card{background:#15151f;border:1px solid #232336;border-radius:12px;padding:12px;margin:8px 0}video{width:100%}</style></head><body><h3 style="text-align:center">🔒 صفحتي الخاصة - بدون ريفرش</h3><div id="feed"></div><script>let seen=new Set();async function load(){let r=await fetch('/api/my/feed');let f=await r.json();let d=document.getElementById('feed');f.reverse().forEach(i=>{let id=String(i.id||i.index);if(seen.has(id))return;seen.add(id);let div=document.createElement('div');div.className='card';div.innerHTML=`<b>${i.time} [${i.country}] 🔒</b><div>${i.text}</div>${i.video?`<video src="${i.video}" controls></video>`:''}`;d.prepend(div)})}load();setInterval(load,8000);</script><div style="text-align:center;margin-top:20px"><a href="/country" style="color:#60A5FA">← دول</a> | <a href="/public" style="color:#10B981">عام</a></div></body></html>
